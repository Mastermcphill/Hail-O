name: hail_o_backend
description: Hail-O backend Shelf API package.
publish_to: none
version: 1.0.0

hooks:
  user_defines:
    sqlite3:
      source: system
      name: sqlite3

environment:
  sdk: ^3.10.8

dependencies:
  bcrypt: ^1.1.3
  crypto: ^3.0.6
  dart_jsonwebtoken: ^3.2.0
  http: ^1.2.2
  path: ^1.9.1
  pool: ^1.5.2
  postgres: ^2.6.4
  shelf: ^1.4.2
  shelf_cors_headers: ^0.1.5
  shelf_router: ^1.1.4
  sentry: ^8.14.2
  sqflite_common: ^2.5.5
  sqflite_common_ffi: ^2.3.6
  uuid: ^4.5.1
  hailo_shared:
    path: ../packages/hailo_shared

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.2
